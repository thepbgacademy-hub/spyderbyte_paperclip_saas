services:
  wf-stage-web:
    image: ${WF_STAGE_WEB_IMAGE:-spyderbyte/web:${SPYDERBYTE_IMAGE_TAG:?set SPYDERBYTE_IMAGE_TAG}}
    container_name: wf-stage-web
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PUBLIC_APP_ORIGIN: ${WF_STAGE_PORTAL_ORIGIN:-https://www.spyderbyte.cloud}
      API_ORIGIN: ${WF_STAGE_API_ORIGIN:-https://wf-api.spyderbyte.cloud}
    networks:
      - ingress

  wf-stage-api:
    image: ${WF_STAGE_API_IMAGE:-spyderbyte/api:${SPYDERBYTE_IMAGE_TAG:?set SPYDERBYTE_IMAGE_TAG}}
    container_name: wf-stage-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set SUPABASE_DB_URL}
      SUPABASE_DB_SSL: ${SUPABASE_DB_SSL:-false}
      WF_ALLOWED_ORIGINS: ${WF_ALLOWED_ORIGINS:?set WF_ALLOWED_ORIGINS}
      WF_API_PORT: "8080"
      WF_API_SESSION_SIGNING_KEY: ${WF_API_SESSION_SIGNING_KEY:?set WF_API_SESSION_SIGNING_KEY}
      WF_API_SESSION_ISSUER: ${WF_API_SESSION_ISSUER:-wealth-factory-runtime}
      WF_API_SESSION_AUDIENCE: ${WF_API_SESSION_AUDIENCE:-wealth-factory-portal}
      WF_HARNESS_ENABLED_WORKFLOW_IDS: ${WF_HARNESS_ENABLED_WORKFLOW_IDS:-}
      WF_NATIVE_EXECUTOR_ENABLED_WORKFLOW_IDS: ${WF_NATIVE_EXECUTOR_ENABLED_WORKFLOW_IDS:-}
      WF_STORAGE_OAUTH_REDIRECT_ORIGIN: ${WF_STORAGE_OAUTH_REDIRECT_ORIGIN:-}
      WF_OBSIDIAN_EXPORT_ROOT: ${WF_OBSIDIAN_EXPORT_ROOT:-}
      WF_WEB_APP_ENTRY_URL: ${WF_WEB_APP_ENTRY_URL:?set WF_WEB_APP_ENTRY_URL}
      WF_WEB_APP_STYLESHEET_URL: ${WF_WEB_APP_STYLESHEET_URL:-}
      WF_PORTAL_SESSION_COOKIE_NAME: ${WF_PORTAL_SESSION_COOKIE_NAME:-wf_portal_session}
      WF_PROVIDER_EXECUTION_MODE: ${WF_PROVIDER_EXECUTION_MODE:-tenant_credentials_required}
      CODEX_HOME: ${WF_OPENAI_CODEX_HOME:?set WF_OPENAI_CODEX_HOME}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      WF_WORKFLOW_QUEUE_NAME: ${WF_WORKFLOW_QUEUE_NAME:?set WF_WORKFLOW_QUEUE_NAME}
      PAPERCLIP_BASE_URL: ${PAPERCLIP_BASE_URL:?set PAPERCLIP_BASE_URL}
      PAPERCLIP_SERVICE_TOKEN: ${PAPERCLIP_SERVICE_TOKEN:?set PAPERCLIP_SERVICE_TOKEN}
      WF_PAPERCLIP_SERVICE_TOKEN_MAP: ${WF_PAPERCLIP_SERVICE_TOKEN_MAP:-}
      WF_PAPERCLIP_LAUNCH_MODE: ${WF_PAPERCLIP_LAUNCH_MODE:-runs}
      WF_PAPERCLIP_BOARD_SESSION_TOKEN: ${WF_PAPERCLIP_BOARD_SESSION_TOKEN:-}
      WF_PAPERCLIP_BOARD_ORIGIN: ${WF_PAPERCLIP_BOARD_ORIGIN:-}
      WF_PAPERCLIP_ADMIN_TOKEN: ${WF_PAPERCLIP_ADMIN_TOKEN:-}
      WF_PAPERCLIP_ISSUE_AGENT_ID: ${WF_PAPERCLIP_ISSUE_AGENT_ID:-}
      WF_PAPERCLIP_ISSUE_POLL_INTERVAL_MS: ${WF_PAPERCLIP_ISSUE_POLL_INTERVAL_MS:-1000}
      WF_PAPERCLIP_ISSUE_MAX_POLL_ATTEMPTS: ${WF_PAPERCLIP_ISSUE_MAX_POLL_ATTEMPTS:-60}
      WF_VAULT_MASTER_KEY: ${WF_VAULT_MASTER_KEY:?set WF_VAULT_MASTER_KEY}
    volumes:
      - ${WF_OPENAI_CODEX_HOME:?set WF_OPENAI_CODEX_HOME}:${WF_OPENAI_CODEX_HOME:?set WF_OPENAI_CODEX_HOME}
    networks:
      - ingress
      - paperclip
      - redis

  wf-stage-worker:
    image: ${WF_STAGE_WORKER_IMAGE:-spyderbyte/worker:${SPYDERBYTE_IMAGE_TAG:?set SPYDERBYTE_IMAGE_TAG}}
    container_name: wf-stage-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set SUPABASE_DB_URL}
      SUPABASE_DB_SSL: ${SUPABASE_DB_SSL:-false}
      WF_ALLOWED_ORIGINS: ${WF_ALLOWED_ORIGINS:?set WF_ALLOWED_ORIGINS}
      WF_HARNESS_ENABLED_WORKFLOW_IDS: ${WF_HARNESS_ENABLED_WORKFLOW_IDS:-}
      WF_NATIVE_EXECUTOR_ENABLED_WORKFLOW_IDS: ${WF_NATIVE_EXECUTOR_ENABLED_WORKFLOW_IDS:-}
      WF_PROVIDER_EXECUTION_MODE: ${WF_PROVIDER_EXECUTION_MODE:-tenant_credentials_required}
      CODEX_HOME: ${WF_OPENAI_CODEX_HOME:?set WF_OPENAI_CODEX_HOME}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      WF_WORKFLOW_QUEUE_NAME: ${WF_WORKFLOW_QUEUE_NAME:?set WF_WORKFLOW_QUEUE_NAME}
      PAPERCLIP_BASE_URL: ${PAPERCLIP_BASE_URL:?set PAPERCLIP_BASE_URL}
      PAPERCLIP_SERVICE_TOKEN: ${PAPERCLIP_SERVICE_TOKEN:?set PAPERCLIP_SERVICE_TOKEN}
      WF_PAPERCLIP_SERVICE_TOKEN_MAP: ${WF_PAPERCLIP_SERVICE_TOKEN_MAP:-}
      WF_PAPERCLIP_LAUNCH_MODE: ${WF_PAPERCLIP_LAUNCH_MODE:-runs}
      WF_PAPERCLIP_BOARD_SESSION_TOKEN: ${WF_PAPERCLIP_BOARD_SESSION_TOKEN:-}
      WF_PAPERCLIP_BOARD_ORIGIN: ${WF_PAPERCLIP_BOARD_ORIGIN:-}
      WF_PAPERCLIP_ADMIN_TOKEN: ${WF_PAPERCLIP_ADMIN_TOKEN:-}
      WF_PAPERCLIP_ISSUE_AGENT_ID: ${WF_PAPERCLIP_ISSUE_AGENT_ID:-}
      WF_PAPERCLIP_ISSUE_POLL_INTERVAL_MS: ${WF_PAPERCLIP_ISSUE_POLL_INTERVAL_MS:-1000}
      WF_PAPERCLIP_ISSUE_MAX_POLL_ATTEMPTS: ${WF_PAPERCLIP_ISSUE_MAX_POLL_ATTEMPTS:-60}
      WF_WORKER_CONCURRENCY: ${WF_WORKER_CONCURRENCY:-2}
      WF_WORKER_MAX_ACTIVE_PER_TENANT: ${WF_WORKER_MAX_ACTIVE_PER_TENANT:-1}
      WF_VAULT_MASTER_KEY: ${WF_VAULT_MASTER_KEY:?set WF_VAULT_MASTER_KEY}
      WF_PAPERCLIP_AUTH_PROBE_COMPANY_ID: ${WF_PAPERCLIP_AUTH_PROBE_COMPANY_ID:-}
    volumes:
      - ${WF_OPENAI_CODEX_HOME:?set WF_OPENAI_CODEX_HOME}:${WF_OPENAI_CODEX_HOME:?set WF_OPENAI_CODEX_HOME}
    networks:
      - ingress
      - paperclip
      - redis

networks:
  ingress:
    external: true
    name: supabase_default
  paperclip:
    external: true
    name: paperclip-gwry_default
  redis:
    external: true
    name: redis-tzbr_default
